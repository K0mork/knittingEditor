# GitHub Releasesの「Generate release notes」で使う分類。PRのラベルで振り分ける。
changelog:
  categories:
    - title: 新機能
      labels: [enhancement]
    - title: 不具合の修正
      labels: [bug]
    - title: ドキュメント
      labels: [documentation]
    - title: 依存関係
      labels: [dependencies]
    - title: その他
      labels: ["*"]

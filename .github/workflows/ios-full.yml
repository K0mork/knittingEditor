name: Full iOS validation

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      - 'packages/**'
      - '!packages/**/*.md'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.shared.ts'
      - 'scripts/third-party-notices.mjs'
      - 'tsconfig*.json'
      - 'playwright.config.ts'
      - '.github/workflows/**'
      - '!.github/workflows/**/*.md'
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# マージのたびに5つのmacOSジョブを積むと、PRのCIの順番待ちが増える。同じブランチでは最新の
# 実行だけを残し、古い実行は取り消す。最新のコミットはそれ以前の変更をすべて含む。
concurrency:
  group: ios-full-${{ github.ref }}
  cancel-in-progress: true

# `main`で失敗したときの再実行とIssueの作成は、終わってからios-full-failure.ymlが行う。

jobs:
  # 夜間は、同じコミットをすでに検証していれば走らせない。GitHubは夜間の開始を数時間
  # 遅らせることがあり、日中のPRとmacOSランナーを取り合うため。判定できないときは走らせる。
  decide:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether this run is needed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != schedule ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 同じコミットの検証を夜間に繰り返さない。スキップされた夜間も、同じコミットの
          # 成功した実行があるときだけスキップされているので、この判定で問題ない。
          if ! total="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios-full.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')"; then
            echo "could not check previous runs; running the validation" >&2
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$total" =~ ^[0-9]+$ ]] && (( total >= 1 )); then
            echo "commit $GITHUB_SHA was already validated; skipping this nightly run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "commit $GITHUB_SHA has not been validated; running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  ios_full:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: 'iPhone 17'
          - device: 'iPad (A16)'
          # 小さい画面のiPhoneでは、全テストではなく`device-ui-tests.txt`の一覧だけを流す。
          - device: 'iPhone SE (3rd generation)'
            ui_list: ios/UITests/device-ui-tests.txt
    runs-on: xcode-27
    # ci.ymlの`ios`ジョブと同じく、提出用のアーカイブを作る手元のXcodeと同じ27.2に固定する。
    # イメージにiPhone SE (3rd generation)の端末は無いが、boot-simulator.shがiOS 27.2のランタイムから作る。
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    # 遅いランナーではUIテストが一様に延び、全テストが成功したあとに45分で取り消された
    # ことがある（#447）。Xcode 27.2のイメージではUIテストが全体に遅く、iPadは58.6分かかった（#289）。
    # 止まったテストは、テストごとの上限（最大360秒）で先に打ち切られる。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Xcodeのビルドフェーズ（ios/scripts/build-web.sh）がnpmとViteを実行する。ランナーに
      # 入っているNodeに任せず、Ubuntuのジョブと同じ`.node-version`の版にそろえる。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Show Xcode, Node, and Simulator runtimes
        run: |
          xcodebuild -version
          node --version
          xcrun simctl list runtimes
      # xcodebuildに任せると、ビルド後に初回起動してすぐテストを始めるため、起動直後の
      # 初期化処理とUIテストが重なってXCUITestの操作1つが数十秒かかることがある。
      # 先に起動を始め、完了を待ってからビルドに入り、ビルドの間に落ち着かせる。
      - name: Boot simulator
        id: simulator
        run: |
          udid="$(ios/scripts/boot-simulator.sh '${{ matrix.device }}')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Wait for simulator boot
        run: xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b
      - name: Run iOS tests
        env:
          UI_LIST: ${{ matrix.ui_list }}
        run: |
          set -eo pipefail
          # 一覧がある組は、その1行を1つの`-only-testing`にして、一覧のテストだけを流す。
          # コメント行と空行は除く（ios/scripts/run-device-ui-tests.shと同じ組み立て方）。
          only=""
          if [[ -n "$UI_LIST" ]]; then
            only=$(grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' "$UI_LIST" \
              | sed 's|^|-only-testing:knittingEditorUITests/|') || only=""
          fi
          # 一覧があるのに選ぶテストが無ければ、全テストを流さずに失敗させる。
          if [[ -n "$UI_LIST" && -z "$only" ]]; then
            echo "UI_LIST=$UI_LIST から -only-testing を1件も組み立てられない。一覧が空か、読めない。" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          xcodebuild test \
            -project ios/knittingEditor.xcodeproj \
            -scheme knittingEditor \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 360 \
            $only \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-tests.log"
          # 一覧の`-only-testing`が1件も一致しないと、xcodebuildは0件で終わることがある。
          if [[ -n "$UI_LIST" ]] && ! grep -Eq 'Executed [1-9][0-9]* tests?,' "$RUNNER_TEMP/ios-tests.log"; then
            echo "UI_LIST=$UI_LIST の -only-testing が1件も一致せず、テストが実行されなかった。" >&2
            exit 1
          fi
      # 再試行で成功したケースも、初回失敗の画面写真を調べられるように残す。
      - name: Detect test case failures
        id: test_failures
        if: ${{ !cancelled() }}
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          if grep -Eq "Test Case '.*' failed \(" "$RUNNER_TEMP/ios-tests.log"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          device="$(printf '%s' "$DEVICE" | tr -cs 'A-Za-z0-9_-' '-')"
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Upload failed test results
        if: ${{ failure() || steps.test_failures.outputs.found == 'true' }}
        # 調査用の保存に失敗しても、テストの結果は変えない。
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-tests-${{ steps.test_failures.outputs.device }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/ios-tests.log
          retention-days: 7
          if-no-files-found: ignore
      # テストのためにビルドしたDebugのアプリをそのまま検査する。ビルドし直すと1〜2分かかる。
      - name: Verify generated app bundle
        run: ios/scripts/check-app-bundle.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/knittingEditor.app"

  app_update:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 前の版のデータが更新後に残るかは端末の形に依存しないので、iPhoneだけで確かめる。
        # macOSの同時実行枠（5台）に全ジョブを収める。
        device:
          - 'iPhone 17'
    runs-on: xcode-27
    # `ios`ジョブと同じXcodeに固定する。
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    # 前のリリースのアプリも作るため、実作業は15分ほど。ランナーの後片付けが5分以上
    # かかって、検証が全部成功しているのにcancelled扱いになったことがある。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # 更新前のアプリを、HEADから辿れる最新のリリースのタグから作るため、履歴とタグを取る。
        with:
          fetch-depth: 0
      # `ios_full`ジョブと同じ理由で、`.node-version`の版のNodeを使う。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Show Xcode, Node, and Simulator runtimes
        run: |
          xcodebuild -version
          node --version
          xcrun simctl list runtimes
      # `ios`ジョブと同じ理由で先に起動を始める。完了はスクリプトがビルド前に待つ。
      - name: Boot simulator
        id: simulator
        run: |
          udid="$(ios/scripts/boot-simulator.sh '${{ matrix.device }}')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Simulate app update from the previous release and restore IndexedDB
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          APP_UPDATE_RESULTS_DIR: ${{ runner.temp }}/app-update-results
        # macOSの/bin/bash 3.2は、EXITのtrapがあると未定義の変数で止まっても0で終わり、
        # 途中で止まったのに成功になったことがある。最後の成功の行が出たときだけ成功にする。
        run: |
          ios/scripts/simulate-app-update.sh \
            '${{ matrix.device }}' \
            'platform=iOS Simulator,name=${{ matrix.device }},OS=latest' \
            2>&1 | tee "$RUNNER_TEMP/app-update.log"
          grep -qF 'アプリ更新シミュレーション成功' "$RUNNER_TEMP/app-update.log"
      # `ios_full`ジョブと同じく、再試行で通ったテストの1回目の失敗も画面写真で調べられるようにする（#441）。
      - name: Find failed app update tests
        id: test_failures
        if: ${{ !cancelled() }}
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          if grep -Eq "Test Case '.*' failed \(" "$RUNNER_TEMP/app-update.log"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          device="$(printf '%s' "$DEVICE" | tr -cs 'A-Za-z0-9_-' '-')"
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Upload failed app update test results
        if: ${{ failure() || steps.test_failures.outputs.found == 'true' }}
        # 調査用の保存に失敗しても、テストの結果は変えない。
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-update-${{ steps.test_failures.outputs.device }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app-update-results
            ${{ runner.temp }}/app-update.log
          retention-days: 7
          if-no-files-found: ignore

  release_archive:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: xcode-27
    # `ios`ジョブと同じXcodeに固定する。
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `ios_full`ジョブと同じ理由で、`.node-version`の版のNodeを使う。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Show Xcode, Node, and Simulator runtimes
        run: |
          xcodebuild -version
          node --version
          xcrun simctl list runtimes
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Create unsigned Release archive
        run: >-
          xcodebuild archive
          -project ios/knittingEditor.xcodeproj
          -scheme knittingEditor
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/knittingEditor.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Verify archived app bundle
        run: ios/scripts/check-release-assets.sh "$RUNNER_TEMP/knittingEditor.xcarchive/Products/Applications/knittingEditor.app"

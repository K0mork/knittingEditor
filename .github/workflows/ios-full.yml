name: Full iOS validation

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      - 'packages/**'
      - '!packages/**/*.md'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.shared.ts'
      - 'scripts/third-party-notices.mjs'
      - 'tsconfig*.json'
      - 'playwright.config.ts'
      - '.github/workflows/**'
      - '!.github/workflows/**/*.md'
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# マージのたびに5つのmacOSジョブを積むと、PRのCIの順番待ちが増える。同じブランチでは最新の
# 実行だけを残し、古い実行は取り消す。最新のコミットはそれ以前の変更をすべて含む。
concurrency:
  group: ios-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios_full:
    strategy:
      fail-fast: false
      matrix:
        device:
          - 'iPhone 17'
          - 'iPad (A16)'
    runs-on: macos-26
    # App Store提出に要るiOS 26 SDKを持ち、イメージにあるSimulatorのランタイムと版が揃うXcodeに固定する。
    # イメージの既定Xcodeが替わってもビルドとテストのXcodeが変わらないよう、明示的に選ぶ。
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # UIテストの追加で、iPadの実行が28〜29分かかるようになり、テストが成功し続けている
    # まま30分で取り消されたことがある。テストの増加に備えて余裕を持たせる。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Xcodeのビルドフェーズ（ios/scripts/build-web.sh）がnpmとViteを実行する。ランナーに
      # 入っているNodeに任せず、Ubuntuのジョブと同じ`.node-version`の版にそろえる。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Show Xcode, Node, and Simulator runtimes
        run: |
          xcodebuild -version
          node --version
          xcrun simctl list runtimes
      # xcodebuildに任せると、ビルド後に初回起動してすぐテストを始めるため、起動直後の
      # 初期化処理とUIテストが重なってXCUITestの操作1つが数十秒かかることがある。
      # 先に起動を始め、完了を待ってからビルドに入り、ビルドの間に落ち着かせる。
      - name: Boot simulator
        id: simulator
        run: |
          udid="$(ios/scripts/boot-simulator.sh '${{ matrix.device }}')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Wait for simulator boot
        run: xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b
      - name: Run iOS tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/knittingEditor.xcodeproj \
            -scheme knittingEditor \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 150 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-tests.log"
      # 再試行で成功したケースも、初回失敗の画面写真を調べられるように残す。
      - name: Detect test case failures
        id: test_failures
        if: ${{ !cancelled() }}
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          if grep -Eq "Test Case '.*' failed \(" "$RUNNER_TEMP/ios-tests.log"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          device="$(printf '%s' "$DEVICE" | tr -cs 'A-Za-z0-9_-' '-')"
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Upload failed test results
        if: ${{ failure() || steps.test_failures.outputs.found == 'true' }}
        # 調査用の保存に失敗しても、テストの結果は変えない。
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-tests-${{ steps.test_failures.outputs.device }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/ios-tests.log
          retention-days: 7
          if-no-files-found: ignore
      # テストのためにビルドしたDebugのアプリをそのまま検査する。ビルドし直すと1〜2分かかる。
      - name: Verify generated app bundle
        run: ios/scripts/check-app-bundle.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/knittingEditor.app"

  app_update:
    strategy:
      fail-fast: false
      matrix:
        device:
          - 'iPhone 17'
          - 'iPad (A16)'
    runs-on: macos-26
    # `ios`ジョブと同じXcodeに固定する。
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # 実作業は8〜10分。ランナーの後片付けが5分以上かかって20分を超え、
    # 検証が全部成功しているのにcancelled扱いになったことがある。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `ios_full`ジョブと同じ理由で、`.node-version`の版のNodeを使う。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Show Xcode, Node, and Simulator runtimes
        run: |
          xcodebuild -version
          node --version
          xcrun simctl list runtimes
      # `ios`ジョブと同じ理由で先に起動を始める。完了はスクリプトがビルド前に待つ。
      - name: Boot simulator
        id: simulator
        run: |
          udid="$(ios/scripts/boot-simulator.sh '${{ matrix.device }}')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Simulate app update and restore IndexedDB
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          ios/scripts/simulate-app-update.sh \
            '${{ matrix.device }}' \
            'platform=iOS Simulator,name=${{ matrix.device }},OS=latest'

  release_archive:
    runs-on: macos-26
    # `ios`ジョブと同じXcodeに固定する。
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `ios_full`ジョブと同じ理由で、`.node-version`の版のNodeを使う。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Show Xcode, Node, and Simulator runtimes
        run: |
          xcodebuild -version
          node --version
          xcrun simctl list runtimes
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Create unsigned Release archive
        run: >-
          xcodebuild archive
          -project ios/knittingEditor.xcodeproj
          -scheme knittingEditor
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/knittingEditor.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Verify archived app bundle
        run: ios/scripts/check-release-assets.sh "$RUNNER_TEMP/knittingEditor.xcarchive/Products/Applications/knittingEditor.app"

  report_failure:
    needs: [ios_full, app_update, release_archive]
    if: ${{ failure() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # 同時に失敗したrunによるIssueの重複作成を防ぐ。
    concurrency:
      group: ios-full-failure-issue
      cancel-in-progress: false
    steps:
      - name: Report full iOS validation failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title='Full iOS validation failed'
          issue="$(gh issue list --state open --label bug --label priority:P1 --label platform:ios --limit 1000 --json number,title --jq 'map(select(.title == "Full iOS validation failed")) | first | .number // empty')"
          body="iOSの全検証が失敗しました。該当コミットの失敗ジョブとログを確認してください。\n\nCommit: $COMMIT\nRun: $RUN_URL"
          printf '%b\n' "$body" > "$RUNNER_TEMP/ios-full-failure.md"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/ios-full-failure.md"
          else
            gh issue create --title "$title" --label bug --label priority:P1 --label platform:ios --body-file "$RUNNER_TEMP/ios-full-failure.md"
          fi

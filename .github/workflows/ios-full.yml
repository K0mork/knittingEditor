name: Full iOS validation

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      - 'packages/**'
      - '!packages/**/*.md'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.shared.ts'
      - 'scripts/third-party-notices.mjs'
      - 'tsconfig*.json'
      - 'playwright.config.ts'
      - '.github/workflows/**'
      - '!.github/workflows/**/*.md'
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# マージのたびに5つのmacOSジョブを積むと、PRのCIの順番待ちが増える。同じブランチでは最新の
# 実行だけを残し、古い実行は取り消す。最新のコミットはそれ以前の変更をすべて含む。
concurrency:
  group: ios-full-${{ github.ref }}
  cancel-in-progress: true

# `main`で失敗したときの再実行とIssueの作成は、終わってからios-full-failure.ymlが行う。

jobs:
  ios_full:
    strategy:
      fail-fast: false
      matrix:
        device:
          - 'iPhone 17'
          - 'iPad (A16)'
    runs-on: macos-26
    # App Store提出に要るiOS 26 SDKを持ち、イメージにあるSimulatorのランタイムと版が揃うXcodeに固定する。
    # イメージの既定Xcodeが替わってもビルドとテストのXcodeが変わらないよう、明示的に選ぶ。
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # UIテストの追加で、iPadの実行が28〜29分かかるようになり、テストが成功し続けている
    # まま30分で取り消されたことがある。テストの増加に備えて余裕を持たせる。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Xcodeのビルドフェーズ（ios/scripts/build-web.sh）がnpmとViteを実行する。ランナーに
      # 入っているNodeに任せず、Ubuntuのジョブと同じ`.node-version`の版にそろえる。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Show Xcode, Node, and Simulator runtimes
        run: |
          xcodebuild -version
          node --version
          xcrun simctl list runtimes
      # xcodebuildに任せると、ビルド後に初回起動してすぐテストを始めるため、起動直後の
      # 初期化処理とUIテストが重なってXCUITestの操作1つが数十秒かかることがある。
      # 先に起動を始め、完了を待ってからビルドに入り、ビルドの間に落ち着かせる。
      - name: Boot simulator
        id: simulator
        run: |
          udid="$(ios/scripts/boot-simulator.sh '${{ matrix.device }}')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Wait for simulator boot
        run: xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b
      - name: Run iOS tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/knittingEditor.xcodeproj \
            -scheme knittingEditor \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 150 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-tests.log"
      # 再試行で成功したケースも、初回失敗の画面写真を調べられるように残す。
      - name: Detect test case failures
        id: test_failures
        if: ${{ !cancelled() }}
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          if grep -Eq "Test Case '.*' failed \(" "$RUNNER_TEMP/ios-tests.log"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          device="$(printf '%s' "$DEVICE" | tr -cs 'A-Za-z0-9_-' '-')"
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Upload failed test results
        if: ${{ failure() || steps.test_failures.outputs.found == 'true' }}
        # 調査用の保存に失敗しても、テストの結果は変えない。
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-tests-${{ steps.test_failures.outputs.device }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/ios-tests.log
          retention-days: 7
          if-no-files-found: ignore
      # テストのためにビルドしたDebugのアプリをそのまま検査する。ビルドし直すと1〜2分かかる。
      - name: Verify generated app bundle
        run: ios/scripts/check-app-bundle.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/knittingEditor.app"

  app_update:
    strategy:
      fail-fast: false
      matrix:
        device:
          - 'iPhone 17'
          - 'iPad (A16)'
    runs-on: macos-26
    # `ios`ジョブと同じXcodeに固定する。
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # 前のリリースのアプリも作るため、実作業は15分ほど。ランナーの後片付けが5分以上
    # かかって、検証が全部成功しているのにcancelled扱いになったことがある。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # 更新前のアプリを、HEADから辿れる最新のリリースのタグから作るため、履歴とタグを取る。
        with:
          fetch-depth: 0
      # `ios_full`ジョブと同じ理由で、`.node-version`の版のNodeを使う。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Show Xcode, Node, and Simulator runtimes
        run: |
          xcodebuild -version
          node --version
          xcrun simctl list runtimes
      # `ios`ジョブと同じ理由で先に起動を始める。完了はスクリプトがビルド前に待つ。
      - name: Boot simulator
        id: simulator
        run: |
          udid="$(ios/scripts/boot-simulator.sh '${{ matrix.device }}')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Simulate app update from the previous release and restore IndexedDB
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        # macOSの/bin/bash 3.2は、EXITのtrapがあると未定義の変数で止まっても0で終わり、
        # 途中で止まったのに成功になったことがある。最後の成功の行が出たときだけ成功にする。
        run: |
          ios/scripts/simulate-app-update.sh \
            '${{ matrix.device }}' \
            'platform=iOS Simulator,name=${{ matrix.device }},OS=latest' \
            2>&1 | tee "$RUNNER_TEMP/app-update.log"
          grep -qF 'アプリ更新シミュレーション成功' "$RUNNER_TEMP/app-update.log"

  release_archive:
    runs-on: macos-26
    # `ios`ジョブと同じXcodeに固定する。
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `ios_full`ジョブと同じ理由で、`.node-version`の版のNodeを使う。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Show Xcode, Node, and Simulator runtimes
        run: |
          xcodebuild -version
          node --version
          xcrun simctl list runtimes
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Create unsigned Release archive
        run: >-
          xcodebuild archive
          -project ios/knittingEditor.xcodeproj
          -scheme knittingEditor
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/knittingEditor.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Verify archived app bundle
        run: ios/scripts/check-release-assets.sh "$RUNNER_TEMP/knittingEditor.xcarchive/Products/Applications/knittingEditor.app"

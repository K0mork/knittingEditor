name: CI and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRでは新しいpushで古いrunを打ち切る。`main`では打ち切らずに順番に実行する。打ち切ると、
# Webの変更を含むrunが`deploy`の前に止まり、続くMarkdownやiOSだけの変更のrunは配信しない。
# 待機中のrunは次のrunに置き換えられることがあるため、`changes`はWebの判定を前回の配信からの差分で行う。
concurrency:
  group: knitting-editor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      web: ${{ steps.detect.outputs.web }}
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          if [[ -z "$base" ]]; then base='${{ github.event.before }}'; fi
          # 比較対象を決められないとき（新規ブランチの初回pushなど）は範囲を絞らず全部検証する。
          # ここで推測すると、検証を取りこぼしたままci-gateだけ緑になる。
          if [[ -z "$base" ]] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base commit is unavailable; validating web and ios"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed="$(git diff --name-only "$base" "$GITHUB_SHA")"; then
            echo "could not diff $base..$GITHUB_SHA; validating web and ios" >&2
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          classify() {
            web=false
            ios=false
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                # Markdownはどちらのビルド入力でもない。App Store文書の検査は
                # 常に走る`app_store_docs`が受け持つので、ここでは何も立てない。
                *.md|docs/*)
                  ;;
                ios/*)
                  ios=true
                  ;;
                packages/*|package.json|package-lock.json|vite.config.ts|vite.shared.ts|scripts/third-party-notices.mjs|tsconfig*.json|playwright.config.ts|.github/workflows/*)
                  web=true
                  ios=true
                  ;;
                *)
                  web=true
                  ;;
              esac
            done <<< "$1"
          }
          classify "$changed"
          # `main`への配信は、直前のコミットではなく最後にPagesへ配信できたコミットとの差分で決める。
          # 打ち切られたり置き換えられたりしたrunのWebの変更も、次のrunで配信されるようにするため。
          # 配信元を確かめられなければ、配信を取りこぼさないよう`web=true`にする。
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            ios_from_before="$ios"
            deployed=''
            ids="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=30" --jq '.[].id')" || ids=''
            for id in $ids; do
              state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')" || state=''
              if [[ "$state" == success ]]; then
                deployed="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.sha')" || deployed=''
                break
              fi
            done
            if [[ -n "$deployed" ]] && git cat-file -e "$deployed^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$deployed" "$GITHUB_SHA" \
              && since_deploy="$(git diff --name-only "$deployed" "$GITHUB_SHA")"; then
              classify "$since_deploy"
              echo "last Pages deployment: $deployed"
            else
              echo "last Pages deployment is unavailable; deploying web" >&2
              web=true
            fi
            ios="$ios_from_before"
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "web=$web ios=$ios"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - run: npm run test:e2e
      # 配信の準備は`main`のrunだけで行う（`deploy`と同じ条件）。
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  # App Store提出用の文書はMarkdownのテキスト検査だけで、ビルドもSimulatorも要らない。
  # 変更範囲の判定に関係なく常に実行し、skipで素通りする経路を作らない。
  app_store_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Check PR UI smoke test list
        run: node scripts/check-pr-smoke-ui-tests.mjs
      - name: Check the App Store documents
        run: ios/scripts/check-app-store-docs.sh

  # 中身は型検査とVitestだけで、XcodeもSimulatorも使わない。macOSランナーは同時に
  # 動かせる数が少ないので、ここで1つ使うとSimulatorを使うジョブが空きを待つ。
  ios_web:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck iOS Web bundle
        working-directory: ios/Web
        run: ../../node_modules/.bin/tsc -p tsconfig.app.json --noEmit
      - name: Test iOS Web bundle
        working-directory: ios/Web
        run: ../../node_modules/.bin/vitest run --config vite.config.ts

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    # App Store提出に要るiOS 26 SDKを持ち、イメージにあるSimulatorのランタイムと版が揃うXcodeに固定する。
    # イメージの既定Xcodeが替わってもビルドとテストのXcodeが変わらないよう、明示的に選ぶ。
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # 再試行やSimulatorの起動遅延に備え、既存の上限を維持する。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show Xcode and Simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      # xcodebuildに任せると、ビルド後に初回起動してすぐテストを始めるため、起動直後の
      # 初期化処理とUIテストが重なってXCUITestの操作1つが数十秒かかることがある。
      # 先に起動を始め、完了を待ってからビルドに入り、ビルドの間に落ち着かせる。
      - name: Boot simulator
        id: simulator
        run: |
          udid="$(ios/scripts/boot-simulator.sh 'iPhone 17')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Wait for simulator boot
        run: xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b
      - name: Run iOS unit tests and PR UI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-pr-smoke-ui-tests.mjs
          unit_targets="$(ruby -ryaml -e 'targets = YAML.load_file("ios/project.yml").fetch("targets").select { |_, target| target["type"] == "bundle.unit-test" }.keys; abort "No unit test targets found" if targets.empty?; puts targets')"
          selections=()
          while IFS= read -r target; do
            selections+=("-only-testing:$target")
          done <<< "$unit_targets"
          while IFS= read -r test || [[ -n "$test" ]]; do
            [[ "$test" =~ ^[[:space:]]*(#|$) ]] && continue
            selections+=("-only-testing:knittingEditorUITests/$test")
          done < ios/UITests/pr-smoke-ui-tests.txt
          xcodebuild test \
            -project ios/knittingEditor.xcodeproj \
            -scheme knittingEditor \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 150 \
            -maximum-test-execution-time-allowance 240 \
            "${selections[@]}" \
            CODE_SIGNING_ALLOWED=NO
      # テストのためにビルドしたDebugのアプリをそのまま検査する。ビルドし直すと1〜2分かかる。
      - name: Verify generated app bundle
        run: ios/scripts/check-app-bundle.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/knittingEditor.app"

  ci-gate:
    if: always()
    needs: [changes, web, ios_web, ios, app_store_docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks relevant to this change
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_NEEDED: ${{ needs.changes.outputs.web }}
          IOS_NEEDED: ${{ needs.changes.outputs.ios }}
          WEB_RESULT: ${{ needs.web.result }}
          IOS_WEB_RESULT: ${{ needs.ios_web.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          DOCS_RESULT: ${{ needs.app_store_docs.result }}
        run: |
          set -eu
          # 変更範囲によらず常に実行するジョブ。条件を持たないので、skipで素通りしない。
          if [[ "$DOCS_RESULT" != success ]]; then
            echo "App Store document result: $DOCS_RESULT" >&2
            exit 1
          fi
          # 変更範囲を判定できていなければ、必要なジョブが全部skipされていても検証済みとは言えない。
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "change detection result: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$WEB_NEEDED" != true && "$WEB_NEEDED" != false ]] || [[ "$IOS_NEEDED" != true && "$IOS_NEEDED" != false ]]; then
            echo "change detection produced no decision: web=$WEB_NEEDED ios=$IOS_NEEDED" >&2
            exit 1
          fi
          if [[ "$WEB_NEEDED" == true && "$WEB_RESULT" != success ]]; then
            echo "Web validation result: $WEB_RESULT" >&2
            exit 1
          fi
          if [[ "$IOS_NEEDED" == true ]]; then
            for result in "$IOS_WEB_RESULT" "$IOS_RESULT"; do
              [[ "$result" == success ]] || { echo "iOS validation result: $result" >&2; exit 1; }
            done
          fi

  deploy:
    # `!cancelled()`が無いと、Web専用の変更でiOS系ジョブがskipされたとき、それらを経由して
    # ci-gateに依存するこのジョブも暗黙の`success()`でskipされ、Pagesへ配信されない。
    # 配信元は`main`に限る。`workflow_dispatch`は任意のブランチから実行でき、`web=true`になるため、
    # イベントの種類だけで判定すると`main`以外のブランチが本番へ配信されうる。PRのrunのrefは
    # `refs/pull/<番号>/merge`なので、この条件で除かれる。
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true' && needs.ci-gate.result == 'success' && needs.web.result == 'success' }}
    needs: [changes, ci-gate, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  smoke:
    # 配信した成果物が本番で返ることを確かめる。CDNの反映待ちはスクリプト側で再試行する。
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Download the deployed Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Extract the deployed files
        run: |
          mkdir "$RUNNER_TEMP/deployed"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$RUNNER_TEMP/deployed"
      - name: Check https://knittingeditor.com/
        run: node scripts/check-live-site.mjs --dist "$RUNNER_TEMP/deployed"

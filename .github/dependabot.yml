# 依存の更新PRを週1回、まとめて作る。
# package-lock.jsonの変更はWebとiOSの両方のCIを起動するため、PRの数を絞る。
# 作られたPRには開発ログが無い。マージ前にDEVELOPMENT_LOG.mdへ記録を追加するコミットをpushする（AGENTS.mdのGitHub Workflow）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    # 公開直後の版は取り下げや乗っ取りの可能性があるため、1週間待ってから取り込む。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

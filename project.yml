name: knittingEditor

options:
  bundleIdPrefix: com.k0mork
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO

targets:
  knittingEditor:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Build local Web assets
        script: "\"${SRCROOT}/scripts/build-web.sh\""
        basedOnDependencyAnalysis: false
    sources:
      - path: App
      - path: AppResources/Web
        type: folder
        buildPhase: resources
    resources:
      - path: App/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.k0mork.knittingEditor
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - knittingEditorTests
        - knittingEditorUITests

  knittingEditorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/KnittingEditorAppTests
    dependencies:
      - target: knittingEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.k0mork.knittingEditor.tests
        GENERATE_INFOPLIST_FILE: YES

  knittingEditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/KnittingEditorUITests
    dependencies:
      - target: knittingEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.k0mork.knittingEditor.uitests
        GENERATE_INFOPLIST_FILE: YES
